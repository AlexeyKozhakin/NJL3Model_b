name: tests-b0

on:
  push:
    paths: ['njl3/**', 'tests/b0/**', 'web/b0/**', 'functions/**', 'pyproject.toml', '.github/workflows/tests-b0.yml']
  pull_request:
    paths: ['njl3/**', 'tests/b0/**', 'web/b0/**', 'functions/**', 'pyproject.toml', '.github/workflows/tests-b0.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" numba
      - name: Tests (Python, numerical integrators, JS port)
        run: pytest tests/b0 -q
