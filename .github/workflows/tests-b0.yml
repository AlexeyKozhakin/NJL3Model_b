name: tests

on:
  push:
    paths: ['njl3/**', 'tests/b0/**', 'tests/full/**', 'tests/inf/**', 'web/b0/**', 'web/full/**', 'functions/**', 'examples/**', 'paper/**', 'pyproject.toml', '.github/workflows/tests-b0.yml']
  pull_request:
    paths: ['njl3/**', 'tests/b0/**', 'tests/full/**', 'tests/inf/**', 'web/b0/**', 'web/full/**', 'functions/**', 'examples/**', 'paper/**', 'pyproject.toml', '.github/workflows/tests-b0.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" numba
      - name: Tests b = 0 (Python, numerical integrators, JS port)
        run: pytest tests/b0 -q
      - name: Tests (M, b) (Python, JS port)
        run: pytest tests/full -q
      - name: Tests L -> infinity
        run: pytest tests/inf -q
      - name: Tests GN stability (second variation)
        run: pytest tests/stab -q
      - name: Tests homogeneous case, arbitrary phi and g
        run: pytest tests/hom -q
      - name: Tests inhomogeneous case, twist phi
        run: pytest tests/inh -q

  # njl3.b0 as a referee installs it: clean environment, no numba, no research code
  b0-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Tests b = 0 (fast)
        run: pytest tests/b0 -q -m "not slow"
      - name: Test-run examples (fast)
        run: python examples/run_examples.py --fast

  reproduce-quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[plot]"
      - name: Reproduce figures and tables (quick mode)
        run: python paper/reproduce.py --quick
