<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJL3 Model — Интерактивные срезы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">
    <header class="bg-blue-700 text-white p-4 shadow z-10">
        <h1 class="text-xl font-bold">NJL3 Model — Интерактивные тепловые карты и срезы</h1>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Левая панель управления -->
        <aside class="w-80 bg-white shadow-lg p-5 overflow-y-auto border-r border-gray-200">
            <h2 class="text-lg font-semibold mb-4 text-gray-800">Параметры</h2>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">μ</label>
                    <input type="number" id="param-mu" value="5.0" step="0.1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 px-3 py-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">L</label>
                    <input type="number" id="param-L" value="0.25" step="0.05" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 px-3 py-2 border">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">g</label>
                    <select id="param-g" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 px-3 py-2 border">
                        <option value="-1" selected>-1.0 (отталкивающее)</option>
                        <option value="1">+1.0 (притягивающее)</option>
                    </select>
                </div>

                <hr class="border-gray-200">

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-gray-500">b min</label>
                        <input type="number" id="param-bmin" value="0" step="0.1" class="block w-full rounded border px-2 py-1">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500">b max</label>
                        <input type="number" id="param-bmax" value="10" step="0.1" class="block w-full rounded border px-2 py-1">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500">M min</label>
                        <input type="number" id="param-Mmin" value="0" step="0.1" class="block w-full rounded border px-2 py-1">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500">M max</label>
                        <input type="number" id="param-Mmax" value="10" step="0.1" class="block w-full rounded border px-2 py-1">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs text-gray-500">N_b</label>
                        <input type="number" id="param-Nb" value="50" min="10" max="300" step="10" class="block w-full rounded border px-2 py-1">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500">N_M</label>
                        <input type="number" id="param-NM" value="50" min="10" max="300" step="10" class="block w-full rounded border px-2 py-1">
                    </div>
                </div>

                <hr class="border-gray-200">

                <div class="flex items-center gap-2">
                    <input type="checkbox" id="show-omegaMuL" checked class="rounded text-blue-600">
                    <label for="show-omegaMuL" class="text-sm text-gray-700">Показывать Ω<sub>μL</sub></label>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="show-dU" checked class="rounded text-blue-600">
                    <label for="show-dU" class="text-sm text-gray-700">Показывать dU</label>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="show-omegaL" checked class="rounded text-blue-600">
                    <label for="show-omegaL" class="text-sm text-gray-700">Показывать Ω<sub>L</sub></label>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="show-classical" checked class="rounded text-blue-600">
                    <label for="show-classical" class="text-sm text-gray-700">Показывать M²/(2g)</label>
                </div>

                <button id="btn-calculate" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded shadow transition">
                    Рассчитать
                </button>

                <div id="progress-container" class="hidden">
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                    <p id="progress-text" class="text-xs text-gray-500 mt-1 text-center">0 / 0</p>
                </div>

                <div id="result-info" class="hidden bg-gray-50 border rounded p-3 text-sm">
                    <p><strong>Минимум:</strong></p>
                    <p>b<sub>min</sub> = <span id="res-bmin" class="font-mono"></span></p>
                    <p>M<sub>min</sub> = <span id="res-mmin" class="font-mono"></span></p>
                    <p>Ω<sub>min</sub> = <span id="res-omin" class="font-mono"></span></p>
                </div>
            </div>
        </aside>

        <!-- Правая часть с графиками -->
        <main class="flex-1 p-4 overflow-y-auto bg-gray-50">
            <!-- Табы -->
            <div class="mb-4 border-b border-gray-200">
                <ul class="flex flex-wrap -mb-px text-sm font-medium text-center">
                    <li class="mr-2">
                        <button id="tab-heatmap" class="inline-block p-4 text-blue-600 border-b-2 border-blue-600 rounded-t-lg active">
                            2D Heatmap
                        </button>
                    </li>
                    <li class="mr-2">
                        <button id="tab-slices" class="inline-block p-4 text-gray-500 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300">
                            1D Срезы
                        </button>
                    </li>
                    <li class="mr-2">
                        <button id="tab-components" class="inline-block p-4 text-gray-500 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300">
                            Компоненты
                        </button>
                    </li>
                </ul>
            </div>

            <!-- Панель Heatmap -->
            <div id="panel-heatmap" class="tab-panel">
                <div class="bg-white p-3 rounded shadow">
                    <div id="plot-heatmap" style="width:100%; height:550px;"></div>
                    <p class="text-xs text-gray-500 mt-2">Кликните на heatmap, чтобы зафиксировать точку для срезов. Белый крест — текущий минимум.</p>
                </div>
            </div>

            <!-- Панель Срезов -->
            <div id="panel-slices" class="tab-panel hidden">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div class="bg-white p-3 rounded shadow">
                        <div id="plot-slice-b" style="width:100%; height:350px;"></div>
                        <p class="text-xs text-gray-500 mt-1 text-center">Срез при фиксированном b</p>
                    </div>
                    <div class="bg-white p-3 rounded shadow">
                        <div id="plot-slice-M" style="width:100%; height:350px;"></div>
                        <p class="text-xs text-gray-500 mt-1 text-center">Срез при фиксированном M</p>
                    </div>
                </div>
                <div class="mt-4 bg-white p-3 rounded shadow">
                    <div id="plot-slice-combined" style="width:100%; height:400px;"></div>
                    <p class="text-xs text-gray-500 mt-1 text-center">Совмещённые срезы с отдельными вкладами</p>
                </div>
            </div>

            <!-- Панель Компонентов -->
            <div id="panel-components" class="tab-panel hidden">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div class="bg-white p-3 rounded shadow">
                        <div id="plot-comp-omegaMuL" style="width:100%; height:400px;"></div>
                    </div>
                    <div class="bg-white p-3 rounded shadow">
                        <div id="plot-comp-dU" style="width:100%; height:400px;"></div>
                    </div>
                    <div class="bg-white p-3 rounded shadow">
                        <div id="plot-comp-omegaL" style="width:100%; height:400px;"></div>
                    </div>
                    <div class="bg-white p-3 rounded shadow">
                        <div id="plot-comp-classical" style="width:100%; height:400px;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/njl.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
